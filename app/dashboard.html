<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Dashboard de la empresa (todo se llena desde Supabase en js/dashboard.js):
      1. Estado actual en lenguaje sencillo (último escaneo de CADA equipo)
      2. Qué atender primero: tecnologías agrupadas, con fallas y acciones
      3. Equipos (tarjetas editables) y evolución
      4. Historial de escaneos con detalle y reintento
    Los textos de niveles, fallas y acciones vienen de data/recomendaciones.json
  -->
  <title>CyberRisk — Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%2305080c'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' font-size='18' fill='%2300c8e8'>⬡</text></svg>" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="css/app.css" />
  <!-- Tema oscuro/claro (debe ir al final del <head>) -->
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <script src="../assets/js/theme.js"></script>
</head>
<body class="app-body">

  <!-- ── Barra superior ── -->
  <header class="app-topbar">
    <a href="../index.html" class="app-brand" aria-label="Volver al wiki del proyecto">
      <span class="app-brand__mark" aria-hidden="true">CR</span>
      <span><span class="app-accent">Cyber</span>Risk</span>
    </a>
    <div class="app-topbar__empresa">
      <label for="sel-empresa" class="app-sr-only">Empresa</label>
      <select id="sel-empresa" class="app-select" hidden></select>
      <span id="nombre-empresa" class="app-text-bright"></span>
      <span id="rol-usuario" class="app-pill"></span>
    </div>
    <div class="app-topbar__user">
      <span id="usuario" class="app-muted"></span>
      <button type="button" class="app-btn app-btn--ghost" id="btn-salir">Salir</button>
    </div>
  </header>

  <main class="app-main">
    <div id="alerta" class="app-alert" role="alert" hidden></div>

    <!-- ── 1. Estado actual ── -->
    <section class="app-hero" id="hero" aria-live="polite">
      <p class="app-muted">Cargando tu estado de seguridad…</p>
    </section>

    <!-- ── 2. Qué atender primero ── -->
    <section class="app-panel" aria-labelledby="h-prioridades">
      <div class="app-panel__head">
        <div>
          <h2 id="h-prioridades" class="app-panel__title">Qué atender primero</h2>
          <p class="app-muted app-small">Ordenado por nivel de riesgo. Abre cada uno para ver qué podría pasar y qué hacer.</p>
        </div>
      </div>
      <div id="prioridades"></div>
    </section>

    <div class="app-cols">
      <!-- ── 3a. Equipos ── -->
      <section class="app-panel" aria-labelledby="h-activos">
        <div class="app-panel__head">
          <h2 id="h-activos" class="app-panel__title">Equipos</h2>
          <div class="app-acciones">
            <a href="escaneo.html" class="app-btn app-btn--ghost" id="btn-nuevo-escaneo" hidden
               title="Sitio web, nube, red y servidores que el agente no ve">+ Sin agente</a>
            <button type="button" class="app-btn app-btn--primary" id="btn-agregar-equipo" hidden>+ Agregar equipo</button>
          </div>
        </div>
        <div id="panel-codigo" class="app-codigo" role="status" hidden></div>
        <div id="activos"></div>
      </section>

      <!-- ── 3b. Evolución ── -->
      <section class="app-panel" aria-labelledby="h-evolucion">
        <h2 id="h-evolucion" class="app-panel__title">Evolución</h2>
        <div id="evolucion"></div>
      </section>
    </div>

    <!-- ── 4. Historial ── -->
    <section class="app-panel" aria-labelledby="h-historial">
      <h2 id="h-historial" class="app-panel__title">Historial de escaneos</h2>
      <div id="historial"></div>
    </section>
  </main>

  <!-- Detalle de un escaneo (se llena al pulsar "Ver detalle") -->
  <dialog id="detalle" class="app-dialog" aria-labelledby="detalle-titulo">
    <div class="app-dialog__head">
      <h2 id="detalle-titulo" class="app-panel__title">Detalle del escaneo</h2>
      <button type="button" class="app-btn app-btn--ghost" id="detalle-cerrar">Cerrar</button>
    </div>
    <div id="detalle-cuerpo"></div>
  </dialog>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
